name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: node --import tsx --test 'test/**/*.test.mjs'

      - name: Smoke test (spawns the real MCP server)
        run: npm run smoke

      - name: Derive up-to-date check
        run: |
          npm run derive
          git diff --exit-code src/data/catalogue-derived.json

      - name: Installer dry-run
        run: node scripts/setup.mjs --ide all --global --dry-run

      - name: Build (compiled path)
        run: npm run build