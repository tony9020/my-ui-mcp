name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and CLI tests
        run: node --import tsx --test 'test/**/*.test.mjs'

      - name: Smoke test (spawns the real MCP server)
        run: npm run smoke

      - name: Derive up-to-date check
        run: |
          npm run derive
          node -e "const fs=require('fs');const crypto=require('crypto');const src=fs.readFileSync('src/data/components.json');const der=JSON.parse(fs.readFileSync('src/data/catalogue-derived.json'));const h=crypto.createHash('sha256').update(src).digest('hex');console.log('sourceHash match:', der.meta.sourceHash === h); if (der.meta.sourceHash !== h) process.exit(1);"

      - name: Installer dry-run
        run: node scripts/setup.mjs --ide all --global --dry-run

      - name: Build (compiled path)
        run: npm run build

      - name: Compiled CLI smoke
        run: |
          node bin/myui.mjs status --json
          node bin/myui.mjs search button --limit 1 --json
          node bin/myui.mjs audit test/fixtures/clean.tsx --json
          node bin/myui.mjs publish test/fixtures/clean.tsx --dry-run --json